<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Kalfi">
  <!--
    Kalfi mark — geometric K + answer bar (signature).
    currentColor version for UI / mono.
  -->
  <g fill="currentColor">
    <!-- Stem -->
    <rect x="8" y="6" width="13" height="52" rx="6.5"/>
    <!-- Upper arm: diagonal with flat vertical tip -->
    <path d="M23 29.5 23 15c0-1.15 1.3-1.8 2.2-1.1l24.2 18.4c1.15.88.5 2.7-1 2.7H32.4c-.75 0-1.45-.35-1.9-.95L23 29.5Z"/>
    <!-- Lower arm -->
    <path d="M23 34.5 23 49c0 1.15 1.3 1.8 2.2 1.1l24.2-18.4c1.15-.88.5-2.7-1-2.7H32.4c-.75 0-1.45.35-1.9.95L23 34.5Z"/>
    <!-- Answer bar -->
    <rect x="23" y="27" width="23" height="10" rx="5"/>
  </g>
</svg>
