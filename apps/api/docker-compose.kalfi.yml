# Drop-in beside n8n on the same Hostinger VPS Docker host.
# Joins Traefik network `root_default` (from /root/docker-compose.yml).
#
# Usage on VPS:
#   cd /opt/kalfi/apps/api
#   cp .env.example .env   # fill secrets
#   docker compose -f docker-compose.kalfi.yml up -d --build
#
# Public URL (wildcard Hostinger DNS already points here):
#   https://api.srv835792.hstgr.cloud
# Later add A record api.chatlm.tech → 145.79.12.59 and extend Host() rule.

services:
  kalfi-api:
    build: .
    container_name: kalfi-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Local health checks only — public traffic goes through Traefik
      - "127.0.0.1:8787:8787"
    volumes:
      - kalfi_api_data:/data
    mem_limit: 512m
    cpus: 1.0
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.kalfi-api.rule=Host(`api.srv835792.hstgr.cloud`)
      - traefik.http.routers.kalfi-api.entrypoints=web,websecure
      - traefik.http.routers.kalfi-api.tls=true
      - traefik.http.routers.kalfi-api.tls.certresolver=mytlschallenge
      - traefik.http.services.kalfi-api.loadbalancer.server.port=8787

volumes:
  kalfi_api_data:

networks:
  proxy:
    external: true
    name: root_default
